name: Signed Android Release
on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: ${{ hashFiles('android/gradlew') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure private signing key
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > projectvault-release.jks
          printf 'storeFile=projectvault-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
